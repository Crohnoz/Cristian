[build]
  command = "npm test"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/login"
  to = "/auth.html"
  status = 200
  force = true

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200
  force = true

[[redirects]]
  from = "/reset-password"
  to = "/reset-password.html"
  status = 200
  force = true

[[redirects]]
  from = "/activate"
  to = "/activate.html"
  status = 200
  force = true

[[redirects]]
  from = "/users"
  to = "/users.html"
  status = 200
  force = true

[[redirects]]
  from = "/student"
  to = "/student.html"
  status = 200
  force = true

[[redirects]]
  from = "/instructor"
  to = "/instructor.html"
  status = 200
  force = true

[[redirects]]
  from = "/certificate"
  to = "/certificate.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
