<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-label="Visual cybersecurity quiz"><rect width="1280" height="760" rx="34" fill="#1d2624"/><rect x="52" y="56" width="1176" height="648" rx="28" fill="#25312e" stroke="#44534e"/><text x="92" y="106" fill="#9caea8" font-family="Inter,Arial" font-size="11" letter-spacing="2">KNOWLEDGE CHECK · 03/05</text><text x="92" y="156" fill="#eef3f1" font-family="Inter,Arial" font-size="30" font-weight="700">¿Qué señal pesa más?</text><text x="92" y="190" fill="#9fb0aa" font-family="Inter,Arial" font-size="14">Elige la mejor evidencia antes de clasificar.</text><rect x="92" y="232" width="1096" height="146" rx="18" fill="#202a28"/><circle cx="140" cy="305" r="22" fill="#3c4c47"/><text x="180" y="286" fill="#dce5e2" font-family="Inter,Arial" font-size="15" font-weight="700">Mensaje de entrenamiento</text><text x="180" y="317" fill="#9fb0aa" font-family="Inter,Arial" font-size="13">El remitente usa un canal no esperado y solicita actuar con urgencia.</text><text x="180" y="347" fill="#b9c7c2" font-family="Inter,Arial" font-size="12">Contexto sintético · sin credenciales · awareness only</text><g font-family="Inter,Arial"><rect x="92" y="416" width="528" height="92" rx="16" fill="#293633" stroke="#51615c"/><circle cx="124" cy="462" r="12" fill="#42514d"/><text x="155" y="455" fill="#e1e8e5" font-size="13" font-weight="700">A · El color del botón</text><text x="155" y="480" fill="#94a7a1" font-size="11">Señal débil por sí sola</text><rect x="660" y="416" width="528" height="92" rx="16" fill="#33413d" stroke="#748a80"/><circle cx="692" cy="462" r="12" fill="#789285"/><text x="723" y="455" fill="#edf3f1" font-size="13" font-weight="700">B · Canal + contexto + urgencia</text><text x="723" y="480" fill="#b7c5c0" font-size="11">Mejor evidencia combinada</text><rect x="92" y="530" width="528" height="92" rx="16" fill="#293633" stroke="#51615c"/><circle cx="124" cy="576" r="12" fill="#42514d"/><text x="155" y="569" fill="#e1e8e5" font-size="13" font-weight="700">C · La hora del mensaje</text><text x="155" y="594" fill="#94a7a1" font-size="11">No prueba intención</text><rect x="660" y="530" width="528" height="92" rx="16" fill="#293633" stroke="#51615c"/><circle cx="692" cy="576" r="12" fill="#42514d"/><text x="723" y="569" fill="#e1e8e5" font-size="13" font-weight="700">D · El logo usado</text><text x="723" y="594" fill="#94a7a1" font-size="11">Puede falsificarse fácilmente</text></g><rect x="1010" y="646" width="178" height="34" rx="9" fill="#6f887c"/><text x="1053" y="668" fill="#17201d" font-family="Inter,Arial" font-size="11" font-weight="700">CONTINUAR</text></svg>